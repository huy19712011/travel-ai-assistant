
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Travel Assistant</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f9;margin:40px}
.container{max-width:800px;margin:auto;background:#fff;padding:24px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
textarea{width:100%;height:80px;padding:10px;box-sizing:border-box;font-size:15px}
button{margin-top:12px;padding:10px 20px;cursor:pointer}
#response{margin-top:20px;border:1px solid #ddd;background:#fafafa;padding:15px;min-height:180px;white-space:pre-wrap}
.small{font-size:13px;color:#666;margin-top:10px}
</style>
</head>
<body>
<div class="container">
<h2>AI Travel Assistant</h2>

<label><strong>Your Message</strong></label>
<textarea id="message" placeholder="I'm travelling to Dubai. Show me a 5 day plan..."></textarea>
<br>
<button onclick="sendMessage()">Send</button>

<div class="small">Conversation ID: <span id="conversationId">-</span></div>

<h3>AI Response</h3>
<div id="response">Response will appear here...</div>
</div>

<script>
async function sendMessage(){
 const message=document.getElementById("message").value.trim();
 if(!message){alert("Please enter a message.");return;}
 document.getElementById("response").textContent="Thinking...";
 try{
   const res=await fetch("http://localhost:8080/api/chat",{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({message:message})
   });
   if(!res.ok) throw new Error("HTTP "+res.status);
   const data=await res.json();
   document.getElementById("conversationId").textContent=data.conversationId||"-";
   document.getElementById("response").textContent=data.response;
 }catch(e){
   document.getElementById("response").textContent="Error: "+e.message;
 }
}
</script>
</body>
</html>
