<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Travel Assistant - Streaming</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f9;margin:40px;}
.container{max-width:800px;margin:auto;background:#fff;padding:24px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);}
textarea{width:100%;height:80px;padding:10px;box-sizing:border-box;font-size:15px;}
button{margin-top:12px;padding:10px 20px;cursor:pointer;}
#response{margin-top:20px;border:1px solid #ddd;background:#fafafa;padding:15px;min-height:220px;white-space:pre-wrap;}
.status{margin-top:10px;color:#666;font-size:13px;}
</style>
</head>
<body>

<div class="container">
<h2>AI Travel Assistant (Streaming)</h2>

<label><strong>Your Message</strong></label><br>
<textarea id="message" placeholder="I'm travelling to Dubai. Show me a 5 day plan..."></textarea><br>

<button onclick="streamChat()">Send</button>

<div class="status" id="status">Status: Ready</div>

<h3>AI Response</h3>
<div id="response"></div>

</div>

<script>
async function streamChat(){

    const message=document.getElementById("message").value.trim();

    if(!message){
        alert("Please enter a message.");
        return;
    }

    const responseArea=document.getElementById("response");
    const status=document.getElementById("status");

    responseArea.textContent="";
    status.textContent="Status: Thinking...";

    const response=await fetch("http://localhost:8080/api/chat/stream",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            message:message
        })
    });

    if(!response.ok){
        responseArea.textContent="HTTP Error: "+response.status;
        status.textContent="Status: Failed";
        return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();

    // Buffer for partial SSE frames
    let buffer = "";

    while (true) {
        const { done, value } = await reader.read();

        if (done) {
            break;
        }

        buffer += decoder.decode(value, { stream: true });

        // Process complete SSE events delimited by "\n\n"
        let idx;
        while ((idx = buffer.indexOf('\n\n')) !== -1) {
            const event = buffer.slice(0, idx);
            buffer = buffer.slice(idx + 2);

            // Extract all data: lines and concatenate them according to SSE spec
            const lines = event.split(/\r?\n/);
            const dataLines = lines
                .filter(l => l.startsWith('data:'))
                .map(l => l.replace(/^data:\s?/, ''));

            if (dataLines.length > 0) {
                // Join data lines using '\n' as per SSE semantics for multi-line data fields.
                const eventData = dataLines.join('\n');

                // Insert a space between previously appended text and this event when appropriate.
                // Rule: if previous character exists and is not whitespace, and the eventData
                // starts with an alphanumeric character (not opening punctuation), add a space.
                let toAppend = eventData;
                const prevChar = responseArea.textContent.slice(-1);
                const startsWithAlpha = /^[A-Za-z0-9\u00C0-\u017F]/.test(eventData.charAt(0));
                const startsWithNoSpacePunct = /^[\s.,:;!?%)\]\}]/.test(eventData.charAt(0));

                if (prevChar && !/\s/.test(prevChar) && startsWithAlpha && !startsWithNoSpacePunct) {
                    toAppend = ' ' + toAppend;
                }

                responseArea.textContent += toAppend;
                responseArea.scrollTop = responseArea.scrollHeight;
            }
        }
    }

    status.textContent="Status: Complete";
}
</script>

</body>
</html>
