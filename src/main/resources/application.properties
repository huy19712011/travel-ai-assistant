spring.application.name=travel-ai-assistant

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.stabilityai.api-key=${STABILITY_API_KEY}
spring.ai.stabilityai.image.model=stable-diffusion-xl-1024-v1-0


spring.datasource.url=jdbc:postgresql://localhost:5432/spring_ai
spring.datasource.username=postgres
spring.datasource.password=123456

spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536

logging.level.org.springframework.ai=DEBUG

app.weather.api-key=${WEATHER_API_KEY}
app.data.pdfs.path=data/pdfs
app.audio.upload-dir=data/audio
